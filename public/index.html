<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - OTP Verification</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <!-- Login Step: Enter email/phone -->
    <div id="step-login" class="card">
      <div class="card-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Enter your email or phone number to receive a one-time password</p>
      </div>
      <form id="login-form">
        <div class="input-group">
          <label for="identifier">Email or Phone</label>
          <input
            type="text"
            id="identifier"
            name="identifier"
            placeholder="you@example.com or +1234567890"
            autocomplete="email"
            required
          />
        </div>
        <button type="submit" id="send-otp-btn" class="btn btn-primary">
          <span class="btn-text">Send OTP</span>
          <span class="btn-loader hidden">
            <span class="spinner"></span>
          </span>
        </button>
      </form>
      <div id="login-error" class="error-message hidden"></div>
    </div>

    <!-- OTP Step: Enter OTP -->
    <div id="step-otp" class="card hidden">
      <div class="card-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </div>
        <h1>Verify OTP</h1>
        <p class="subtitle" id="otp-subtitle">Enter the 6-digit code sent to your email/phone</p>
      </div>
      <form id="otp-form">
        <div class="otp-inputs" id="otp-inputs">
          <input type="text" maxlength="1" class="otp-box" data-index="0" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" required />
          <input type="text" maxlength="1" class="otp-box" data-index="1" inputmode="numeric" pattern="[0-9]" required />
          <input type="text" maxlength="1" class="otp-box" data-index="2" inputmode="numeric" pattern="[0-9]" required />
          <input type="text" maxlength="1" class="otp-box" data-index="3" inputmode="numeric" pattern="[0-9]" required />
          <input type="text" maxlength="1" class="otp-box" data-index="4" inputmode="numeric" pattern="[0-9]" required />
          <input type="text" maxlength="1" class="otp-box" data-index="5" inputmode="numeric" pattern="[0-9]" required />
        </div>
        <button type="submit" id="verify-otp-btn" class="btn btn-primary">
          <span class="btn-text">Verify & Login</span>
          <span class="btn-loader hidden">
            <span class="spinner"></span>
          </span>
        </button>
      </form>
      <div id="otp-error" class="error-message hidden"></div>
      <div class="otp-footer">
        <p>Didn't receive the code?
          <button id="resend-btn" class="link-btn" disabled>Resend OTP (<span id="resend-timer">30</span>s)</button>
        </p>
        <button id="back-btn" class="link-btn">Use a different email/phone</button>
      </div>
    </div>

    <!-- Success Step -->
    <div id="step-success" class="card hidden">
      <div class="card-header">
        <div class="logo success-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <h1>Login Successful</h1>
        <p class="subtitle" id="success-message">You are now logged in.</p>
      </div>
      <div class="user-info" id="user-info"></div>
      <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </div>

    <!-- Dev OTP Display (only in dev mode) -->
    <div id="dev-otp-display" class="dev-banner hidden">
      <strong>Dev Mode:</strong> Your OTP is <code id="dev-otp-code"></code>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
